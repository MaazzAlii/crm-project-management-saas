# =============================================================================
# Innoventix Platform v2 — Production PostgreSQL Tuning Configuration
# Optimized for 4 vCPU / 8GB-16GB RAM VPS (Contabo / Self-Hosted Docker)
# =============================================================================

# -----------------------------------------------------------------------------
# Connectivity & Networking
# -----------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100
superuser_reserved_connections = 3
unix_socket_directories = '/var/run/postgresql'

# -----------------------------------------------------------------------------
# Memory Management
# -----------------------------------------------------------------------------
# Dedicated RAM for caching data pages (~25% of total server RAM)
shared_buffers = 2GB

# Estimated memory available for OS & Postgres disk caching (~75% of total RAM)
effective_cache_size = 6GB

# Maintenance work memory for VACUUM, CREATE INDEX, ALTER TABLE
maintenance_work_mem = 512MB

# Work memory per sorting/hashing node in query plans
work_mem = 32MB

# Memory for autovacuum worker processes
autovacuum_work_mem = 128MB
autovacuum_max_workers = 4
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# -----------------------------------------------------------------------------
# Write Ahead Log (WAL) & Checkpoints
# -----------------------------------------------------------------------------
wal_level = replica
wal_buffers = 16MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB

# Disk synchronisation (full data safety)
synchronous_commit = on

# -----------------------------------------------------------------------------
# Query Planner & Cost Tuning (SSD / NVMe VPS optimized)
# -----------------------------------------------------------------------------
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200
default_statistics_target = 100

# -----------------------------------------------------------------------------
# Performance Extensions & Monitoring
# -----------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.save = on

# -----------------------------------------------------------------------------
# Logging & Slow Query Tracking
# -----------------------------------------------------------------------------
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 100 # Log queries taking > 100ms
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
log_temp_files = 1024
log_checkpoints = on
