version: '3.8'

# =============================================================================
# Innoventix Platform v2 — Coolify Self-Hosted Production Stack
# Drop-in Compose template for Coolify Dashboard on Contabo VPS
# =============================================================================

services:
  # Next.js Application Service (Managed by Coolify Nixpacks/Docker)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${SERVICE_POSTGRES_URL}
      - JWT_SECRET=${JWT_SECRET:-d0a391b9da5876ead44bdbf4de07fa3cf73ebe0355f65521e9b902f256c4851f}
      - REFRESH_SECRET=${REFRESH_SECRET:-fc75593f45889b1e6fbd283ab846b36d0b6998b4954097f3e8fc4d8c6adb5807}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET:-fc75593f45889b1e6fbd283ab846b36d0b6998b4954097f3e8fc4d8c6adb5807}
      - NEXT_PUBLIC_APP_URL=${APP_URL:-https://app.innoventixhub.com}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "coolify.managed=true"

  # Dedicated Managed PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-innoventix}
      POSTGRES_USER: ${POSTGRES_USER:-innoventix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-innoventix_user} -d ${POSTGRES_DB:-innoventix}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
