groups:
  - name: innoventix
    interval: 30s
    rules:
      # Database alerts
      - alert: DatabaseDown
        expr: pg_up == 0
        for: 2m
        annotations:
          summary: "PostgreSQL database is down"

      - alert: HighConnectionUsage
        expr: pg_stat_activity_count > 80
        for: 5m
        annotations:
          summary: "High database connection usage ({{ $value }} connections)"

      # Application alerts
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        annotations:
          summary: "High error rate detected ({{ $value | humanize }}%)"

      - alert: HighLatency
        expr: histogram_quantile(0.95, http_request_duration_seconds) > 2
        for: 5m
        annotations:
          summary: "High API latency (p95: {{ $value }}s)"

      # Disk space alerts
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.15
        for: 5m
        annotations:
          summary: "Disk space running low ({{ $value | humanizePercentage }} free)"
