version: '3.8'

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/maazzalii/crm-project-management-saas:latest}
    container_name: innoventix-app
    restart: always
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Staging service isolated on port 3005 for pre-production validation
  app-staging:
    image: ${APP_IMAGE_STAGING:-ghcr.io/maazzalii/crm-project-management-saas:staging}
    container_name: innoventix-app-staging
    restart: unless-stopped
    profiles:
      - staging
    env_file:
      - .env.staging
    ports:
      - "127.0.0.1:3005:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"
