version: '3.8'

# =============================================================================
# Innoventix Platform v2 — Production Multi-Container Docker Stack
# Self-hosted on Contabo VPS / Dedicated Docker Host
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Primary PostgreSQL 16 Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: innoventix-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-innoventix}
      POSTGRES_USER: ${POSTGRES_USER:-innoventix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-innoventix_user} -d ${POSTGRES_DB:-innoventix}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - innoventix-internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 2. Redis 7 In-Memory Cache & Rate Limiting
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: innoventix-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_secure_pass}"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - innoventix-internal

  # ---------------------------------------------------------------------------
  # 3. Next.js SaaS Web Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: innoventix-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-innoventix_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-innoventix}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - innoventix-internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # 4. Nginx Reverse Proxy & SSL Termination
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: innoventix-nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - innoventix-internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 5. Automated Daily Database Backup Service
  # ---------------------------------------------------------------------------
  backup:
    image: postgres:16-alpine
    container_name: innoventix-backup
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-innoventix}
      POSTGRES_USER: ${POSTGRES_USER:-innoventix_user}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
    entrypoint: |
      sh -c '
        echo "0 2 * * * /bin/sh /usr/local/bin/backup-db.sh" > /etc/crontabs/root
        crond -f -l 2
      '
    networks:
      - innoventix-internal

networks:
  innoventix-internal:
    driver: bridge

volumes:
  postgres_data:
    name: innoventix_postgres_data
  redis_data:
    name: innoventix_redis_data
  certbot_etc:
    name: innoventix_certbot_etc
  certbot_var:
    name: innoventix_certbot_var
  certbot_www:
    name: innoventix_certbot_www
